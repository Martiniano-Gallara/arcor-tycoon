<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Calibration 16:9 Map</title>
  <style>
    body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
    #wrapper { position: relative; width: 1376px; height: 768px; margin: 20px auto; border: 2px solid gold; overflow: hidden; }
    #map-img { width: 100%; height: 100%; display: block; }
    .pin { position: absolute; width: 36px; height: 36px; border-radius: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 2px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.8); cursor: pointer; }
    .node-pin { background: radial-gradient(circle, #ffcc00, #cc7700); color: #000; }
    .product-pin { background: radial-gradient(circle, #ff44aa, #880044); color: #fff; font-size: 20px; }
    .banner-pin { background: radial-gradient(circle, #44ccff, #004488); color: #fff; font-size: 14px; border-radius: 6px; padding: 2px 6px; width: auto; height: auto; }
    #coords { padding: 15px; font-family: monospace; background: #222; max-width: 900px; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Calibración Nodos Mapa ARCOR 16:9</h2>
  <div id="wrapper">
    <img id="map-img" src="/saga_map_16_9.jpg" />
    <div id="pins-container"></div>
  </div>
  <div id="coords">Haz clic en el mapa para registrar puntos o arrastrar...</div>
  <script>
    const container = document.getElementById('pins-container');
    const coordsEl = document.getElementById('coords');
    const wrapper = document.getElementById('wrapper');

    // Nodos propuestos sobre el sendero 16:9
    const nodes = [
      { id: 1, x: 12.2, y: 37.0, label: '1' },
      { id: 2, x: 20.8, y: 40.5, label: '2' },
      { id: 3, x: 30.2, y: 41.6, label: '3' },
      { id: 4, x: 39.8, y: 43.5, label: '4' },
      { id: 5, x: 35.5, y: 53.0, label: '5' },
      { id: 6, x: 26.5, y: 59.8, label: '6' },
      { id: 7, x: 17.5, y: 65.5, label: '7' },
      { id: 8, x: 11.2, y: 72.8, label: '8' },
      { id: 9, x: 23.0, y: 84.5, label: '9' },
      { id: 10, x: 50.0, y: 74.0, label: '10' },
      { id: 11, x: 69.5, y: 71.5, label: '11' },
      { id: 12, x: 83.5, y: 57.0, label: '12' }
    ];

    function renderPins() {
      container.innerHTML = '';
      nodes.forEach(n => {
        const d = document.createElement('div');
        d.className = 'pin node-pin';
        d.style.left = n.x + '%';
        d.style.top = n.y + '%';
        d.textContent = n.label;
        d.title = `Nivel ${n.id} (${n.x}%, ${n.y}%)`;
        container.appendChild(d);
      });
      coordsEl.textContent = JSON.stringify(nodes, null, 2);
    }

    wrapper.addEventListener('click', (e) => {
      const rect = wrapper.getBoundingClientRect();
      const xPct = +(((e.clientX - rect.left) / rect.width) * 100).toFixed(1);
      const yPct = +(((e.clientY - rect.top) / rect.height) * 100).toFixed(1);
      console.log(`Click: { x: ${xPct}, y: ${yPct} }`);
    });

    renderPins();
  </script>
</body>
</html>
